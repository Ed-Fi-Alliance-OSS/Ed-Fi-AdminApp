# Minimal local DMS stack: PostgreSQL, Configuration Service (self-contained identity) and DMS.
# Start it with start-dms.ps1, which runs the setup steps between these services in order.
# DMS_IMAGE and CONFIGURATION_SERVICE_IMAGE are set by start-dms.ps1 to the pinned digests.

name: adminapp-dms

services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: adminapp-dms-postgresql
    hostname: dms-postgresql
    # Schema provisioning runs as one large transaction and needs a bigger lock pool.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-edfi_datamanagementservice}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5436}:5432'
    volumes:
      - dms-postgresql:/var/lib/postgresql
    networks:
      - dms-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  config:
    image: ${CONFIGURATION_SERVICE_IMAGE:-edfialliance/ed-fi-api-configuration-service:pre}
    container_name: adminapp-dms-config
    hostname: ed-fi-api-config
    environment:
      ASPNETCORE_HTTP_PORTS: 8081
      AppSettings__Datastore: postgresql
      AppSettings__DeployDatabaseOnStartup: true
      AppSettings__IdentityProvider: self-contained
      AppSettings__MultiTenancy: false
      AppSettings__PathBase: ''
      DatabaseSettings__DatabaseConnection: host=dms-postgresql;port=5432;username=postgres;password=${POSTGRES_PASSWORD};database=${POSTGRES_DB_NAME:-edfi_datamanagementservice};
      DatabaseSettings__EncryptionKey: ${CONFIGURATION_SERVICE_DATABASE_ENCRYPTION_KEY:?CONFIGURATION_SERVICE_DATABASE_ENCRYPTION_KEY is required}
      IdentitySettings__AllowRegistration: true
      IdentitySettings__ConfigServiceRole: cms-client
      IdentitySettings__ClientRole: dms-client
      IdentitySettings__Authority: http://ed-fi-api-config:8081
      IdentitySettings__Audience: account
      IdentitySettings__ClientId: DmsConfigurationService
      IdentitySettings__ClientSecret: ${CONFIGURATION_SERVICE_IDENTITY_CLIENT_SECRET}
      IdentitySettings__RequireHttpsMetadata: false
      IdentitySettings__RoleClaimType: http://schemas.microsoft.com/ws/2008/06/identity/claims/role
      IdentitySettings__EncryptionKey: ${CONFIGURATION_SERVICE_IDENTITY_ENCRYPTION_KEY:?CONFIGURATION_SERVICE_IDENTITY_ENCRYPTION_KEY is required}
      IdentitySettings__ClientSecretHashingIterations: 210000
      ClaimsOptions__ClaimsSource: Embedded
      ClaimsOptions__DataStandardVersion: '5.2'
      Serilog__MinimumLevel__Default: ${LOG_LEVEL:-Information}
    ports:
      - '127.0.0.1:${CONFIGURATION_SERVICE_PORT:-8091}:8081'
    networks:
      - dms-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  dms:
    image: ${DMS_IMAGE:-edfialliance/ed-fi-api:pre}
    container_name: adminapp-dms-api
    hostname: dms
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      AppSettings__AuthenticationService: http://ed-fi-api-config:8081/connect/token
      AppSettings__Datastore: postgresql
      AppSettings__MultiTenancy: false
      AppSettings__PathBase: ''
      # Use the ApiSchema bundled in the image; start-dms.ps1 provisions the database from the same files.
      AppSettings__ApiSchema__UseCustomPath: false
      DATABASE_CONNECTION_STRING_ADMIN: host=dms-postgresql;port=5432;username=postgres;password=${POSTGRES_PASSWORD};database=${POSTGRES_DB_NAME:-edfi_datamanagementservice};
      DatabaseOptions__IsolationLevel: ReadCommitted
      ConfigurationServiceSettings__BaseUrl: http://ed-fi-api-config:8081
      ConfigurationServiceSettings__ClientId: ${DMS_CONFIGURATION_SERVICE_CLIENT_ID:-CMSReadOnlyAccess}
      ConfigurationServiceSettings__ClientSecret: ${DMS_CONFIGURATION_SERVICE_CLIENT_SECRET}
      ConfigurationServiceSettings__Scope: edfi_admin_api/readonly_access
      ConfigurationServiceSettings__EncryptionKey: ${CONFIGURATION_SERVICE_DATABASE_ENCRYPTION_KEY}
      DataManagement__IdentityManagement__Enabled: false
      JwtAuthentication__Authority: http://ed-fi-api-config:8081
      JwtAuthentication__Audience: account
      JwtAuthentication__MetadataAddress: http://ed-fi-api-config:8081/.well-known/openid-configuration
      JwtAuthentication__RequireHttpsMetadata: false
      JwtAuthentication__RoleClaimType: http://schemas.microsoft.com/ws/2008/06/identity/claims/role
      JwtAuthentication__ClientRole: dms-client
      Serilog__MinimumLevel__Default: ${LOG_LEVEL:-Information}
    ports:
      - '127.0.0.1:${DMS_PORT:-8090}:8080'
    networks:
      - dms-local
    restart: unless-stopped
    depends_on:
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

networks:
  dms-local:
    name: dms-local

volumes:
  dms-postgresql:
