name: 'Copilot Setup Steps'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # services:
      # Disabling the SQL Server work for now, with the assumption that Copilot
      # would have trouble working on MSSQL scripts in this repo.
      # mssql:
      #   image: mcr.microsoft.com/mssql/server:2022-latest
      #   ports:
      #     - '1433:1433'
      #   options: >-
      #     --health-cmd "exit 0"
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 3
      #     --name mssql
      #     --user root
      #   env:
      #     ACCEPT_EULA: Y
      #     MSSQL_PID: Express
      #     MSSQL_SA_PASSWORD: ${{ env.DATABASE_PASSWORD }}

    steps:
      - run: |
          sudo systemctl start postgresql.service
          pg_isready
          sudo -u postgres psql -c "CREATE ROLE ${DATABASE_USER} WITH LOGIN PASSWORD '${DATABASE_PASSWORD}';"
          sudo -u postgres psql -c "CREATE DATABASE ${DATABASE_NAME}"
        env:
          DATABASE_USER: sa
          DATABASE_NAME: sbaa
          # Throwaway credential for the local Postgres instance created above, which
          # lives only for the duration of this job and is never reachable outside the
          # runner. Not a real secret, so it's hardcoded here directly rather than
          # sourced from a job-level `env:` block or repo secrets: Copilot code
          # review's dynamic setup-step runner doesn't carry job-level `env:` values
          # into `${{ env.X }}` step references, so they resolved empty in that
          # context even after AC-606 made this a plain literal. See AC-606.
          DATABASE_PASSWORD: postgres_ci_only

