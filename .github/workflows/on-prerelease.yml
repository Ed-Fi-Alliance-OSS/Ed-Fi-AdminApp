name: On Pre-Release
on:
  release:
    types:
      - prereleased

# Secrets are set on the jobs that use them, not here, so other jobs never see them.
env:
  # NPM_REGISTRY and PACKAGE_NAME are intended for use by the Ed-Fi Artifacts publishing
  # action in the future. Add its token to that job's env, not here.
  NPM_REGISTRY: //pkgs.dev.azure.com/ed-fi-alliance/Ed-Fi-Alliance-OSS/_packaging/EdFi/npm/registry/
  PACKAGE_NAME: "AdminApp"
  # Build output (tarballs, SBOM) shared by the jobs below; the eng/release scripts default to it.
  RELEASE_DIR: dist/release
  API_IMAGE_NAME: ${{ vars.API_IMAGE_NAME }}
  FRONTEND_IMAGE_NAME: ${{ vars.FRONTEND_IMAGE_NAME }}
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  REF: ${{ github.ref_name }}

permissions:
  contents: read

# The release scripts are in eng/release so they can be run locally. See eng/README.md.
jobs:
  # Runs npm ci and the build, so it gets no token that can sign or write anything.
  pack:
    name: Build, pack and SBOM
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          # The build never pushes; keep the token out of .git/config for the build tooling.
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Build and pack API and FrontEnd
        id: build
        run: ./eng/release/build-packages.ps1 -OutputDirectory $env:RELEASE_DIR

      - name: Check package.json versions were reverted
        run: git diff --exit-code -- packages/api/package.json packages/fe/package.json

      - name: Generate and check SBOM
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: >
          ./eng/release/new-sbom.ps1
          -Version $env:VERSION
          -PackageName $env:PACKAGE_NAME
          -OutputDirectory $env:RELEASE_DIR

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: ${{ env.RELEASE_DIR }}/
          if-no-files-found: error
          retention-days: 30

  # The only job that can sign. It runs no npm or build code: it attests the files the
  # pack job uploaded, then verifies them before anything is published.
  attest:
    name: Attest and verify
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Sigstore signing (actions/attest)
      attestations: write      # store the attestation in GitHub
      artifact-metadata: write # artifact storage record (actions/attest v4)
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: eng/release
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: ${{ env.RELEASE_DIR }}

      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_DIR }}/*.tgz

      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_DIR }}/*.tgz
          sbom-path: ${{ env.RELEASE_DIR }}/_manifest/spdx_2.2/manifest.spdx.json

      - name: Collect release assets
        id: assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: >
          ./eng/release/collect-release-assets.ps1
          -ProvenanceBundle $env:PROVENANCE_BUNDLE
          -SbomBundle $env:SBOM_BUNDLE
          -PackageName $env:PACKAGE_NAME
          -SourceDirectory $env:RELEASE_DIR
          -OutputDirectory release-assets

      - name: Verify attestations (attestations API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/release/verify-attestations.ps1 -PackagePath release-assets/*.tgz

      # The bundles are what consumers download, so check them as well as the API.
      - name: Verify release bundles
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.assets.outputs.provenance-bundle }}
          SBOM_BUNDLE: ${{ steps.assets.outputs.sbom-bundle }}
        run: >
          ./eng/release/verify-attestations.ps1
          -PackagePath release-assets/*.tgz
          -ProvenanceBundle $env:PROVENANCE_BUNDLE
          -SbomBundle $env:SBOM_BUNDLE

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.PACKAGE_NAME }}-ReleaseAssets"
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  validate-packages:
    name: Validate npm packages
    runs-on: ubuntu-latest
    needs: attest
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: eng/release
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ env.PACKAGE_NAME }}-ReleaseAssets"
          path: release-assets

      # On a fresh runner, as a consumer would: the tarballs must be the files attested.
      - name: Verify attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/release/verify-attestations.ps1 -PackagePath release-assets/*.tgz

      - name: Resolve filenames
        id: files
        shell: bash
        run: |
          set -euo pipefail
          echo "api=$(realpath release-assets/"${PACKAGE_NAME}".Api-*.tgz)" >> "$GITHUB_OUTPUT"
          echo "fe=$(realpath release-assets/"${PACKAGE_NAME}".FrontEnd-*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Extract .nvmrc from packed API tarball
        shell: bash
        env:
          API_TGZ: ${{ steps.files.outputs.api }}
        run: |
          set -euo pipefail
          tar -xzf "$API_TGZ" -O package/.nvmrc > .nvmrc

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install smoke test
        shell: bash
        env:
          API_TGZ: ${{ steps.files.outputs.api }}
          FE_TGZ: ${{ steps.files.outputs.fe }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/validate && cd /tmp/validate
          npm init -y >/dev/null 2>&1
          # Use file: URLs with absolute paths so npm treats these as local tarballs even after cd
          npm install --ignore-scripts "file:$API_TGZ"
          npm install --ignore-scripts "file:$FE_TGZ"
          # Basic existence checks post-install
          test -d node_modules/@edfi/adminapp-api || echo "Warning: API package name not found in node_modules"
          test -d node_modules/@edfi/adminapp-frontend || echo "Warning: FE package name not found in node_modules"

  # Only this job holds a write token, and it runs only after the packages are attested
  # and validated.
  release-assets:
    name: Attach packages, SBOM and attestations to the release
    needs:
      - attest
      - validate-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ env.PACKAGE_NAME }}-ReleaseAssets"
          path: release-assets

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout in this job, so gh cannot infer the repo
          TAG: ${{ github.ref_name }}
        # --clobber lets a re-run of this job replace assets a failed run left behind.
        # The files are always the ones attested and verified by this run.
        run: |
          gh release upload "$TAG" release-assets/* --clobber

      - name: Note skipped publish jobs
        if: github.repository_owner != 'Ed-Fi-Alliance-OSS'
        shell: bash
        run: |
          echo "Docker Hub publishing was skipped: it only runs in the Ed-Fi-Alliance-OSS organization." >> "$GITHUB_STEP_SUMMARY"

  # Publishes outside this repository with organization secrets, so forks skip it and
  # can still test the build, attestation and release steps (see eng/README.md).
  docker-publish:
    name: Publish to Docker Hub
    if: github.repository_owner == 'Ed-Fi-Alliance-OSS'
    runs-on: ubuntu-latest
    needs:
      - pack
    permissions:
      contents: read
    env:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - name: Prepare Tags
        id: prepare-tags
        run: |
          if [[ $REF =~ "Pre-Release" ]]
          then
             # Remove Pre-Release prefix
             PREFIX="Pre-Release-"
             PACKAGEVERSION=${REF#"$PREFIX"}
          else
             PACKAGEVERSION=${REF}
          fi

          if [[ $PACKAGEVERSION =~ "alpha" ]]
          then
            # Pre-releases get the tag "pre"
            APITAGS="${API_IMAGE_NAME}:pre"
            FETAGS="${FRONTEND_IMAGE_NAME}:pre"
          else
            # Releases get the version, plus shortened form for minor release.
            # We are not using shortened form for major or using "latest"
            # because they are too imprecise.
              MINOR=$(echo "$PACKAGEVERSION" | awk -F"." '{print $1"."$2}')
            APITAGS="${API_IMAGE_NAME}:${PACKAGEVERSION},${API_IMAGE_NAME}:${MINOR}"
            FETAGS="${FRONTEND_IMAGE_NAME}:${PACKAGEVERSION},${FRONTEND_IMAGE_NAME}:${MINOR}"
          fi

            echo "APITAGS=$APITAGS" >> "$GITHUB_OUTPUT"
            echo "FETAGS=$FETAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # v3.8.0

      - name: Extract metadata (tags, labels) for admin-app api image
        id: metaapi
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ${{ env.API_IMAGE_NAME }}

      - name: Build and push admin-app api image
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc  # v6.11.0
        with:
          context: "{{defaultContext}}:./"
          cache-from: type=registry,ref=${{ env.API_IMAGE_NAME }}:pre
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          file: packages/api/Dockerfile
          tags: ${{ steps.prepare-tags.outputs.APITAGS }}
          labels: ${{ steps.metaapi.outputs.labels }}
          push: true

      - name: Extract metadata (tags, labels) for admin-app front end image
        id: metafe
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ${{ env.FRONTEND_IMAGE_NAME }}

      - name: Build and push admin-app fe image
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc  # v6.11.0
        with:
          context: "{{defaultContext}}:./"
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:pre
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          file: packages/fe/Dockerfile
          tags: ${{ steps.prepare-tags.outputs.FETAGS }}
          labels: ${{ steps.metafe.outputs.labels }}
          push: true
