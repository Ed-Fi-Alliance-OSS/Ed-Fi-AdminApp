name: On Pre-Release
on:
  release:
    types:
      - prereleased

env:
  # ARTIFACTS_API_KEY, NPM_REGISTRY, PACKAGE_NAME are intended for use by the Ed-Fi
  # Artifacts publishing action in the future.
  ARTIFACTS_API_KEY: ${{ secrets.AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN }}
  NPM_REGISTRY: //pkgs.dev.azure.com/ed-fi-alliance/Ed-Fi-Alliance-OSS/_packaging/EdFi/npm/registry/
  PACKAGE_NAME: "AdminApp"
  MANIFEST_FILE: "_manifest/spdx_2.2/manifest.spdx.json"
  API_IMAGE_NAME: ${{ vars.API_IMAGE_NAME }}
  FRONTEND_IMAGE_NAME: ${{ vars.FRONTEND_IMAGE_NAME }}
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  REF: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  pack:
    name: Build, Pack, SBOM and Attest
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write          # Sigstore signing (actions/attest)
      attestations: write      # store the attestation in GitHub
      artifact-metadata: write # artifact storage record (actions/attest v4)
    defaults:
      run:
        shell: pwsh
    outputs:
      adminApp-version: ${{ steps.versions.outputs.adminApp }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          # The build never pushes; keep the token out of .git/config for the build tooling.
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set Version Numbers
        id: versions
        run: |
          $apiPrefix = "v"

          # Install the MinVer CLI tool
          &dotnet tool install --global minver-cli

          $adminAppVersion = $(minver -t $apiPrefix)

          # Full release name
          "adminApp=$adminAppVersion" >> $env:GITHUB_OUTPUT

          # SemVer
          "adminApp-semver=$($adminAppVersion -Replace $apiPrefix)" >> $env:GITHUB_OUTPUT


      # --- TypeScript API and Frontend Build/Pack/Upload ---
      # Install deps once at root, build both API and Frontend via Nx
      - name: Install dependencies (root)
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false

      - name: Build API (root)
        run: npm run build:api

      - name: Build Frontend (root)
        run: npm run build:fe

      - name: Prepare package versions
        shell: pwsh
        run: |
          pushd packages/api
          npm pkg set version="${{ steps.versions.outputs.adminApp-semver }}"
          popd
          pushd packages/fe
          npm pkg set version="${{ steps.versions.outputs.adminApp-semver }}"
          popd

      - name: Copy build outputs under package roots
        shell: bash
        run: |
          rm -rf packages/api/dist packages/fe/dist
          mkdir -p packages/api/dist packages/fe/dist
          cp -R dist/packages/api/* packages/api/dist/
          cp -R dist/packages/fe/* packages/fe/dist/
          cp .nvmrc packages/api/.nvmrc
          cp .nvmrc packages/fe/.nvmrc

      - name: Pack API (npm pack)
        working-directory: packages/api
        run: npm pack

      - name: Pack Frontend
        working-directory: packages/fe
        run: npm pack

      - name: Rename API and Frontend tgz with version
        shell: bash
        run: |
          VERSION="${{ steps.versions.outputs.adminApp-semver }}"
            API_TGZ=$(find packages/api -maxdepth 1 -type f -name '*.tgz' -print -quit)
            FE_TGZ=$(find packages/fe -maxdepth 1 -type f -name '*.tgz' -print -quit)
          mv "$API_TGZ" "packages/api/AdminApp.Api-${VERSION}.tgz"
          mv "$FE_TGZ" "packages/fe/AdminApp.FrontEnd-${VERSION}.tgz"

      - name: Generate Software Bill of Materials (SBOM)
        env:
          ADMIN_APP_VERSION: ${{ steps.versions.outputs.adminApp }}
        run: |
          $packageName = "${{ env.PACKAGE_NAME }}"
          $version = $env:ADMIN_APP_VERSION

          Get-ChildItem -Path packages/api/AdminApp.Api-*.tgz, packages/fe/AdminApp.FrontEnd-*.tgz |
              ForEach-Object { $_.FullName } > buildfilelist.txt

          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5

          # -bc points at the repo root so component detection reads the root
          # package-lock.json and the node_modules installed by the build above.
          sbom-tool generate `
              -b ./ `
              -bl ./buildfilelist.txt `
              -bc ./ `
              -pn "EdFi.$packageName" `
              -pv $version `
              -nsb https://ed-fi.org `
              -m ./ `
              -ps "Ed-Fi Alliance"

          # pwsh does not stop on a native command failure and the step only
          # reports the last command's exit code, so check sbom-tool explicitly.
          if ($LASTEXITCODE -ne 0) { throw "sbom-tool failed with exit code $LASTEXITCODE" }

          Compress-Archive "${{ env.MANIFEST_FILE }}" -DestinationPath "$packageName.SBOM.zip"

      # A green sbom-tool run can still produce a manifest with only the product in it
      # (no package-lock.json in reach, wrong -bc path, ...). Fail before attesting it.
      - name: Check SBOM content
        shell: bash
        env:
          MANIFEST: ${{ env.MANIFEST_FILE }}
          MIN_DEPENDENCIES: "10"
        run: |
          jq -e . "$MANIFEST" > /dev/null || { echo "::error::SBOM is not valid JSON: $MANIFEST"; exit 1; }
          root=$(jq -r '.packages[] | select(.SPDXID == "SPDXRef-RootPackage") | .name' "$MANIFEST")
          total=$(jq '.packages | length' "$MANIFEST")
          deps=$(jq --arg r "$root" '[.packages[] | select(.name != $r)] | length' "$MANIFEST")
          echo "SBOM: $total packages, $deps dependencies (root: $root)"
          if [ "$deps" -lt "$MIN_DEPENDENCIES" ]; then
            echo "::error::SBOM lists $deps dependencies (minimum $MIN_DEPENDENCIES). Was sbom-tool run without build output?"
            exit 1
          fi

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            packages/api/AdminApp.Api-*.tgz
            packages/fe/AdminApp.FrontEnd-*.tgz

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            packages/api/AdminApp.Api-*.tgz
            packages/fe/AdminApp.FrontEnd-*.tgz
          sbom-path: ${{ env.MANIFEST_FILE }}

      - name: Collect release assets
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          mkdir -p release-assets
          cp "${PACKAGE_NAME}.SBOM.zip" release-assets/
          cp "$PROVENANCE_BUNDLE" "release-assets/${PACKAGE_NAME}.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "release-assets/${PACKAGE_NAME}.sbom.sigstore.json"
          ls -l release-assets

      - name: Self-verify attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          # The attestations API can take a few seconds to index a new attestation.
          verify() {
            for _ in 1 2 3; do
              if gh attestation verify "$@"; then
                echo "Verified: $*"
                return 0
              fi
              sleep 10
            done
            return 1
          }
          # The SBOM predicate type follows the SPDX version sbom-tool emits (SPDX 2.2).
          for f in packages/api/AdminApp.Api-*.tgz packages/fe/AdminApp.FrontEnd-*.tgz; do
            verify "$f" -R "$GITHUB_REPOSITORY"
            verify "$f" -R "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.2
          done

      - name: Upload API npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-npm-package
          path: packages/api/AdminApp.Api-*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Frontend npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fe-npm-package
          path: packages/fe/AdminApp.FrontEnd-*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Upload release assets as Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.PACKAGE_NAME }}-ReleaseAssets"
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  # Only this job holds a write token. The bundles are offline copies of attestations
  # already stored in GitHub, so verification does not depend on this handoff.
  release-assets:
    name: Attach SBOM and attestations to the release
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ env.PACKAGE_NAME }}-ReleaseAssets"
          path: release-assets

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout in this job, so gh cannot infer the repo
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" release-assets/* --clobber

  validate-packages:
    name: Validate npm packages
    runs-on: ubuntu-latest
    needs: pack
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - name: Download API package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-npm-package
          path: api-npm-package

      - name: Download FrontEnd package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fe-npm-package
          path: fe-npm-package

      # The downloaded tarballs must be the exact files attested in the pack job.
      - name: Resolve filenames and verify provenance
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=$(realpath "$(find api-npm-package -type f -name '*.tgz' -print -quit)")
          fe=$(realpath "$(find fe-npm-package -type f -name '*.tgz' -print -quit)")
          gh attestation verify "$api" -R "$GITHUB_REPOSITORY"
          gh attestation verify "$fe" -R "$GITHUB_REPOSITORY"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "fe=$fe" >> "$GITHUB_OUTPUT"

      - name: Extract .nvmrc from packed API tarball
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${{ steps.files.outputs.api }}" -O package/.nvmrc > .nvmrc

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/validate && cd /tmp/validate
          npm init -y >/dev/null 2>&1
          # Use file: URLs with absolute paths so npm treats these as local tarballs even after cd
          npm install --ignore-scripts "file:${{ steps.files.outputs.api }}"
          npm install --ignore-scripts "file:${{ steps.files.outputs.fe }}"
          # Basic existence checks post-install
          test -d node_modules/@edfi/adminapp-api || echo "Warning: API package name not found in node_modules"
          test -d node_modules/@edfi/adminapp-frontend || echo "Warning: FE package name not found in node_modules"

  docker-publish:
    name: Publish to Docker Hub
    if: github.repository_owner == 'Ed-Fi-Alliance-OSS'
    runs-on: ubuntu-latest
    needs:
      - pack
    steps:
      - name: Prepare Tags
        id: prepare-tags
        run: |
          REF="${{ env.REF }}"
          if [[ $REF =~ "Pre-Release" ]]
          then
             # Remove Pre-Release prefix
             PREFIX="Pre-Release-"
             PACKAGEVERSION=${REF#"$PREFIX"}
          else
             PACKAGEVERSION=${REF}
          fi

          if [[ $PACKAGEVERSION =~ "alpha" ]]
          then
            # Pre-releases get the tag "pre"
            APITAGS="${{ env.API_IMAGE_NAME }}:pre"
            FETAGS="${{ env.FRONTEND_IMAGE_NAME }}:pre"
          else
            # Releases get the version, plus shortened form for minor release.
            # We are not using shortened form for major or using "latest"
            # because they are too imprecise.
              MINOR=$(echo "$PACKAGEVERSION" | awk -F"." '{print $1"."$2}')
            APITAGS="${{ env.API_IMAGE_NAME }}:${PACKAGEVERSION},${{ env.API_IMAGE_NAME }}:${MINOR}"
            FETAGS="${{ env.FRONTEND_IMAGE_NAME }}:${PACKAGEVERSION},${{ env.FRONTEND_IMAGE_NAME }}:${MINOR}"
          fi

            echo "APITAGS=$APITAGS" >> "$GITHUB_OUTPUT"
            echo "FETAGS=$FETAGS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # v3.8.0

      - name: Extract metadata (tags, labels) for admin-app api image
        id: metaapi
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ${{ env.API_IMAGE_NAME }}

      - name: Build and push admin-app api image
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc  # v6.11.0
        with:
          context: "{{defaultContext}}:./"
          cache-from: type=registry,ref=${{ env.API_IMAGE_NAME }}:pre
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          file: packages/api/Dockerfile
          tags: ${{ steps.prepare-tags.outputs.APITAGS }}
          labels: ${{ steps.metaapi.outputs.labels }}
          push: true

      - name: Extract metadata (tags, labels) for admin-app front end image
        id: metafe
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ${{ env.FRONTEND_IMAGE_NAME }}

      - name: Build and push admin-app fe image
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc  # v6.11.0
        with:
          context: "{{defaultContext}}:./"
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE_NAME }}:pre
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          file: packages/fe/Dockerfile
          tags: ${{ steps.prepare-tags.outputs.FETAGS }}
          labels: ${{ steps.metafe.outputs.labels }}
          push: true
