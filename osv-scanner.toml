# --- npm-bundled dependencies: glob 13.0.6, minimatch 10.2.5 (devDependency: npm itself) ---
# npm bundles these inside its own tarball, so root `overrides` cannot patch them.
# The copies outside npm are overridden to glob ^14 / minimatch ^11.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
reason = "glob 13.0.6, bundled inside the npm devDependency (build/CI tooling only, not shipped). Fixed in glob 14.0.2 but bundled dependencies cannot be overridden; clears once a npm release bundles the fix."
ignoreUntil = 2027-01-24

