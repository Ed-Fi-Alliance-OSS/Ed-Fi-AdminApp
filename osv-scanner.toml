# Ignored vulnerabilities for OpenSSF Scorecard's "Vulnerabilities" check (osv-scanner).
# Every entry below has no upstream fix available as of the date noted. Re-check before
# the ignoreUntil date and remove entries once a fix ships.
# eng/helpers/check-ignored-vuln-fixes.ps1 automates that check (also runs as an
# informational step in .github/workflows/scorecard.yml).
#
# Entries are either devDependency-only (build/CI tooling) or, where stated, reachable in
# production. A prod entry must say so in its reason and needs a fresh look at each review.

# --- sprintf-js: via tedious -> mssql / connect-mssql-v2 (PRODUCTION dependency) ---
[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = "sprintf-js 1.1.3, via tedious -> mssql / connect-mssql-v2 (production, MSSQL driver). No patched sprintf-js version exists (1.1.3 is the latest) and tedious 20.3.8 / mssql 12.7.10 (latest) still depend on it. Denial of service via unbounded precision specifiers. The same advisory also matches a devDependency-only sprintf-js 1.0.3 (via @istanbuljs/load-nyc-config -> argparse, test tooling). Revisit if the advisory gains a fix."
ignoreUntil = 2026-11-21

